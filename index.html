<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Repair Team - My Jobs</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="phone">

    <!-- Top bar -->

    <header class="top-bar">

        <button
            class="icon-button"
            onclick="openDrawer()"
            aria-label="Open menu"
        >
            ☰
        </button>

        <strong>My Jobs</strong>

        <button
            class="icon-button"
            onclick="openNotifications()"
            aria-label="Notifications"
        >
            ♧
        </button>

    </header>


    <!--Tabs -->

    <div class="tabs">

        <button
            class="tab active"
            onclick="filterJobs('Assigned', this)"
        >
            Assigned
        </button>

        <button
            class="tab"
            onclick="filterJobs('In Progress', this)"
        >
            In Progress
        </button>

        <button
            class="tab"
            onclick="filterJobs('Completed', this)"
        >
            Completed
        </button>

    </div>


    <!-- Jobs -->

    <main
        class="jobs"
        id="jobsContainer"
    >

        <!-- Jobs are loaded with JavaScript -->

    </main>


    <!-- Bottom navigation -->

    <nav class="bottom-nav">

        <button
            class="nav-item active-nav"
            onclick="goToJobs()"
        >

            <span>⌂</span>

            <small>Jobs</small>

        </button>


        <button
            class="nav-item"
            onclick="goToUpdates()"
        >

            <span>▣</span>

            <small>Updates</small>

        </button>


        <button
            class="nav-item"
            onclick="goToProfile()"
        >

            <span>♙</span>

            <small>Profile</small>

        </button>

    </nav>

</div>



<!--DRAWER OVERLAY -->

<div
    id="drawerOverlay"
    class="drawer-overlay hidden"
    onclick="closeDrawer()"
></div>



<!-- SIDE DRAWER= -->

<aside
    id="drawer"
    class="drawer"
>

    <div class="drawer-header">

        <div class="drawer-profile">

            <div class="profile-circle">
                ♙
            </div>

            <div>

                <strong>
                    Repair Team
                </strong>

                <small>
                    Team Member
                </small>

            </div>

        </div>


        <button
            class="close-drawer"
            onclick="closeDrawer()"
        >
            ×
        </button>

    </div>


    <div class="drawer-menu">

        <button
            class="drawer-item active-drawer"
            onclick="goToJobs()"
        >

            <span>⌂</span>

            <div>

                <strong>My Jobs</strong>

                <small>
                    View assigned jobs
                </small>

            </div>

        </button>


        <button
            class="drawer-item"
            onclick="goToUpdates()"
        >

            <span>▣</span>

            <div>

                <strong>Updates</strong>

                <small>
                    View job updates
                </small>

            </div>

        </button>


        <button
            class="drawer-item"
            onclick="goToProfile()"
        >

            <span>♙</span>

            <div>

                <strong>Profile</strong>

                <small>
                    View your profile
                </small>

            </div>

        </button>


        <button
            class="drawer-item"
            onclick="openSettings()"
        >

            <span>⚙</span>

            <div>

                <strong>Settings</strong>

                <small>
                    App settings
                </small>

            </div>

        </button>

    </div>


    <div class="drawer-footer">

        <button
            class="logout-button"
            onclick="logout()"
        >
            ⇥ &nbsp; Log out
        </button>

    </div>

</aside>



<script>

/* JOB DATA */

const jobs = [

    {
        id: "ISS-1047",
        icon: "💧",
        title: "Water leak outside",
        location: "42 Main Road",
        priority: "High",
        assigned: "12 May"
    },

    {
        id: "ISS-1042",
        icon: "🌳",
        title: "Broken streetlight",
        location: "Hill Street",
        priority: "Medium",
        assigned: "11 May"
    },

    {
        id: "ISS-1041",
        icon: "🗑️",
        title: "Pothole",
        location: "3rd Street",
        priority: "Low",
        assigned: "10 May"
    }

];



/*  GET SAVED STATUSES*/

function getSavedStatuses() {

    return JSON.parse(
        localStorage.getItem("jobStatuses") || "{}"
    );

}



/* GET JOB STATUS*/

function getJobStatus(jobId) {

    const statuses =
        getSavedStatuses();

    return statuses[jobId] || "Assigned";

}



/*DISPLAY JOBS */

function displayJobs(filter = "Assigned") {

    const container =
        document.getElementById(
            "jobsContainer"
        );

    container.innerHTML = "";


    const filteredJobs =
        jobs.filter(function(job) {

            return getJobStatus(job.id) === filter;

        });


    if (filteredJobs.length === 0) {

        container.innerHTML = `

            <div class="empty-jobs">

                <div class="empty-icon">
                    ✓
                </div>

                <strong>
                    No ${filter.toLowerCase()} jobs
                </strong>

                <p>
                    Jobs in this category will appear here.
                </p>

            </div>

        `;

        return;

    }


    filteredJobs.forEach(function(job) {

        const card =
            document.createElement("div");


        card.className =
            "job-card";


        card.onclick =
            function() {

                openJob(job.id);

            };


        const priorityClass =
            job.priority.toLowerCase();


        card.innerHTML = `

            <div class="job-icon">
                ${job.icon}
            </div>


            <div class="job-info">

                <strong>
                    ${job.id}
                </strong>

                <p>
                    ${job.title}<br>
                    ${job.location}
                </p>

                <small>
    <span class="priority-badge ${priorityClass}">
        ${job.priority}
    </span>

    · Assigned: ${job.assigned}
</small>

            </div>


            <span class="arrow">
                ›
            </span>

        `;


        container.appendChild(card);

    });

}



/* FILTER TABS */

function filterJobs(
    filter,
    clickedButton
) {

    document
        .querySelectorAll(".tab")
        .forEach(function(button) {

            button.classList.remove("active");

        });


    clickedButton.classList.add("active");


    displayJobs(filter);

}



/* OPEN JOB*/

function openJob(issueNumber) {

    window.location.href =
        "job-details.html?issue=" +
        encodeURIComponent(issueNumber);

}



/* DRAWER*/

function openDrawer() {

    document
        .getElementById("drawer")
        .classList.add("drawer-open");


    document
        .getElementById("drawerOverlay")
        .classList.remove("hidden");

}


function closeDrawer() {

    document
        .getElementById("drawer")
        .classList.remove("drawer-open");


    document
        .getElementById("drawerOverlay")
        .classList.add("hidden");

}



/* BOTTOM NAVIGATION*/

function goToJobs() {

    window.location.href =
        "index.html";

}


function goToUpdates() {

    window.location.href =
        "updates.html";

}


function goToProfile() {

    window.location.href =
        "profile.html";

}



/*NOTIFICATIONS */

function openNotifications() {

    alert(
        "You have no new notifications."
    );

}



/* SETTINGS */

function openSettings() {

    closeDrawer();

    alert(
        "Settings will be available here."
    );

}



/*LOG OUT */

function logout() {

    const confirmLogout =
        confirm(
            "Are you sure you want to log out?"
        );


    if (confirmLogout) {

        alert(
            "You have been logged out."
        );

    }

}



/* INITIAL LOAD */

displayJobs("Assigned");

</script>

</body>

</html>
